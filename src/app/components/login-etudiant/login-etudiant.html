<div class="login">
  <form class="login__carte" [formGroup]="formulaire" (ngSubmit)="soumettre()">
    <p class="login__surtitre">Planification des enseignements</p>
    <h1 class="login__titre">Espace etudiant</h1>
    <p class="login__aide">Consultation de l'emploi du temps de votre classe.</p>

    <label class="champ champ--bloc">
      <span>Login</span>
      <input type="text" formControlName="login" autocomplete="username" />
    </label>

    <label class="champ champ--bloc">
      <span>Mot de passe</span>
      <input type="password" formControlName="motDePasse" autocomplete="current-password" />
    </label>

    @if (erreur(); as message) {
      <p class="login__erreur">{{ message }}</p>
    }

    <button class="bouton bouton--primaire bouton--large" type="submit" [disabled]="enCours()">
      {{ enCours() ? 'Connexion...' : 'Se connecter' }}
    </button>

    <p class="login__indice">Compte de demonstration : etudiant / etudiant</p>

    <nav class="login__liens">
      <a [routerLink]="liens.loginEnseignant">Espace enseignant</a>
      <a [routerLink]="liens.loginChef">Espace chef de departement</a>
    </nav>
  </form>
</div>
